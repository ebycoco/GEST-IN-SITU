appId: com.ebychoco.gest-in-situ
productName: GEST-IN-SITU
directories:
  output: dist-electron-builder
files:
  - dist/**
  - package.json
publish:
  provider: github
  owner: ebycoco
  repo: GEST-IN-SITU
  releaseType: release
releaseInfo:
  releaseNotesFile: release-notes.md
win:
  target: nsis
  icon: resources/icon.ico
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  runAfterFinish: true
  # Script NSIS personnalisé (build/installer.nsh) : désactive le bouton de
  # fermeture système [X] pendant la copie des fichiers (page MUI_PAGE_INSTFILES),
  # pour empêcher une interruption manuelle de l'installeur déclenché
  # automatiquement à la fermeture de l'application (mise à jour auto-updater).
  include: build/installer.nsh
  perMachine: false
  # NOTE : allowToChangeInstallationDirectory retiré — incompatible avec
  # oneClick: true (InvalidConfigurationError d'app-builder-lib au build).
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GEST-IN-SITU
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  artifactName: ${productName}-Setup-v${version}.${ext}
